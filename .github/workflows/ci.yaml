name: G2G-New Pipeline

on:
  push:
    branches:
      - develop

env:
  REPO_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FILE_PATH: "your_file_path" 
      KEY_NAME: "laravel_project" 

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /var/www/html
            eval "$(ssh-agent -s)"
            ssh-add /home/oxblixxx/.ssh/${{ env.KEY_NAME }}
            git clone git@github.com:oxblixxx/Laravel-Roadmap-Advanced-Beginner-Roadmap.git                                           \
            #git fetch --all
            git reset --hard origin/develop
            git pull origin develop
            cd /var/www/html/
            git config --global --add safe.directory /var/www/html/$GITHUB_REPOSITORY
            sudo chown -R www-data:www-data /var/www/html/$GITHUB_REPOSITORY
            sudo chmod -R 775 /var/www/html/$GITHUB_REPOSITORY/storage /var/www/html/$GITHUB_REPOSITORY/bootstrap/cache

            # Ensure environment variables are loaded
            cp .env.example .env

            # Install dependencies
            COMPOSER_ALLOW_SUPERUSER=1 composer install --prefer-dist --no-progress --no-interaction

            # Generate application key
            php artisan key:generate

            # Clear any old cache
            php artisan config:clear
            php artisan cache:clear
            php artisan route:clear
            php artisan view:clear

            # Run migrations (uncomment --seed if you need initial test data)
            # php artisan migrate --force
            # php artisan db:seed --force   # (Optional: Run if you have seeders)

            # Cache config for performance (optional in production)
            php artisan config:cache
            php artisan route:cache

